<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8F1DF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="打刻">
  <meta name="description" content="CS・HDS・RESTの実稼働をシンプルに記録する個人用打刻アプリ">
  <title>打刻</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --sky: #83CDD5;
      --shell: #E8DDD1;
      --teal: #1F9E98;
      --deep: #136F70;
      --aqua: #27B9BD;
      --foam: #EDF5E9;
      --sand: #E9D2B9;
      --paper: #FFFDF8;
      --ink: #174A4A;
      --muted: #6E8887;
      --line: rgba(23, 74, 74, .11);
      --shadow: 0 18px 46px rgba(23, 74, 74, .08);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--foam); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, var(--foam) 0%, var(--shell) 100%);
      transition: background .28s ease;
    }
    body[data-state="cs"] { background: linear-gradient(180deg, var(--sky) 0%, var(--foam) 100%); }
    body[data-state="hds"] { background: linear-gradient(180deg, var(--deep) 0%, var(--aqua) 100%); }
    body[data-state="rest"] { background: linear-gradient(180deg, var(--sand) 0%, var(--shell) 100%); }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
    [hidden] { display: none !important; }

    .app {
      width: min(100% - 18px, 680px);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 0 calc(98px + env(safe-area-inset-bottom));
    }

    .main-card {
      margin-top: 3vh;
      padding: clamp(26px, 7vw, 44px) clamp(16px, 6vw, 38px);
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 28px;
      background: rgba(255,253,248,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .date {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-align: center;
    }
    .clock {
      margin-top: 10px;
      font-size: clamp(50px, 14vw, 86px);
      line-height: .98;
      font-weight: 760;
      letter-spacing: -.06em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .status-wrap { display: flex; justify-content: center; margin: 27px 0 19px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .12em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px rgba(31,158,152,.10);
    }
    body[data-state="hds"] .status-dot { background: var(--paper); box-shadow: 0 0 0 5px rgba(255,253,248,.22); }

    .clock-in-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .clock-action {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 999px;
      padding: 16px 18px;
      color: var(--paper);
      font-size: 16px;
      font-weight: 850;
      letter-spacing: .03em;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .16s ease;
    }
    .clock-action.cs-in { background: var(--sky); color: var(--ink); box-shadow: 0 10px 26px rgba(131,205,213,.20); }
    .clock-action.hds-in { background: var(--deep); box-shadow: 0 10px 26px rgba(19,111,112,.20); }
    .clock-action.clock-out { background: var(--teal); box-shadow: 0 10px 26px rgba(31,158,152,.16); }
    .clock-action:active, .activity-btn:active { transform: scale(.985); }

    .activity-area { margin-top: 17px; }
    .activity-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }
    .activity-btn {
      position: relative;
      min-height: 60px;
      border: 1px solid rgba(23,74,74,.08);
      border-radius: 17px;
      padding: 12px 7px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: .05em;
      cursor: pointer;
      opacity: .55;
      transition: transform .12s ease, opacity .16s ease, box-shadow .16s ease;
    }
    .activity-btn.cs { background: var(--sky); }
    .activity-btn.hds { background: var(--deep); color: var(--paper); }
    .activity-btn.rest { background: var(--sand); }
    .activity-btn.active {
      opacity: 1;
      box-shadow: 0 0 0 3px rgba(255,255,255,.74), 0 10px 24px rgba(23,74,74,.12);
      transform: translateY(-2px);
    }
    .activity-btn.active::after {
      content: "●";
      position: absolute;
      top: 7px;
      right: 9px;
      color: var(--teal);
      font-size: 8px;
    }
    .activity-btn.hds.active::after { color: var(--paper); }

    .shift-details { margin-top: 20px; }
    .in-stamp {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .06em;
    }
    .in-stamp strong {
      margin-left: 6px;
      color: var(--ink);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .cs-stamps {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .cs-stamps strong {
      margin-left: 4px;
      color: var(--ink);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 12px;
    }
    .metric {
      min-width: 0;
      padding: 13px 5px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 16px;
      background: rgba(255,253,248,.70);
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .metric-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .08em;
    }
    .metric-value {
      margin-top: 7px;
      color: var(--ink);
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 780;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }

    .history-head { margin: 4vh 4px 13px; }
    .history-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .history-title { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.04em; }
    .history-note { margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 650; }
    .detail-open {
      border: 0; border-radius: 999px; padding: 9px 13px; background: var(--deep); color: var(--paper);
      font-size: 10px; font-weight: 850; letter-spacing: .04em; cursor: pointer; white-space: nowrap;
    }
    .detail-head { margin: 4vh 4px 13px; }
    .detail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .detail-back {
      border: 0; border-radius: 999px; padding: 9px 13px; background: rgba(255,253,248,.78); color: var(--ink);
      font-size: 10px; font-weight: 850; cursor: pointer; box-shadow: 0 8px 22px rgba(23,74,74,.07);
    }
    .detail-picker {
      margin-top: 14px; display: grid; grid-template-columns: 36px 1fr 36px; gap: 8px; align-items: center;
    }
    .date-step {
      height: 38px; border: 0; border-radius: 13px; background: rgba(255,253,248,.82); color: var(--ink);
      font-size: 18px; font-weight: 800; cursor: pointer;
    }
    .detail-date-input {
      width: 100%; min-width: 0; height: 42px; border: 1px solid rgba(255,255,255,.52); border-radius: 14px;
      padding: 0 11px; background: rgba(255,253,248,.86); color: var(--ink); font-size: 14px; font-weight: 780;
      text-align: center; color-scheme: light;
    }
    .detail-shift {
      margin-bottom: 12px; padding: 16px 15px; border: 1px solid rgba(255,255,255,.50); border-radius: 22px;
      background: rgba(255,253,248,.82); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .detail-shift:last-child { margin-bottom: 0; }
    .detail-shift-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .detail-shift-title { font-size: 12px; font-weight: 850; }
    .detail-shift-range { color: var(--muted); font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timeline { display: grid; gap: 0; }
    .timeline-row {
      display: grid; grid-template-columns: 58px 12px 1fr; gap: 8px; align-items: center; min-height: 34px;
      border-top: 1px solid var(--line);
    }
    .timeline-row:first-child { border-top: 0; }
    .timeline-time { color: var(--ink); font-size: 11px; font-weight: 820; font-variant-numeric: tabular-nums; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); justify-self: center; }
    .timeline-dot.hds { background: var(--deep); }
    .timeline-dot.rest { background: var(--sand); border: 1px solid rgba(23,74,74,.12); }
    .timeline-dot.out { background: var(--teal); }
    .timeline-label { font-size: 11px; font-weight: 760; }
    .detail-note-box { margin-top: 12px; padding: 12px 13px; border-radius: 15px; background: rgba(233,210,185,.30); }
    .detail-note-label { color: var(--muted); font-size: 8px; font-weight: 850; letter-spacing: .08em; }
    .detail-note-text { margin-top: 5px; white-space: pre-wrap; color: var(--ink); font-size: 11px; line-height: 1.6; }
    .table-wrap {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 22px;
      background: rgba(255,253,248,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 10px; }
    th, td {
      padding: 12px 2px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: clip;
    }
    th {
      color: var(--muted);
      font-size: 7.5px;
      font-weight: 850;
      letter-spacing: .03em;
      background: rgba(237,245,233,.52);
    }
    th:first-child, td:first-child { width: 14%; }
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { width: 15%; }
    th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { width: 14%; }
    th:nth-child(7), td:nth-child(7) { width: 14%; }
    tbody tr:last-child td { border-bottom: 0; }
    .row-delete {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--sand);
      color: #765848;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: transform .12s ease, filter .12s ease;
    }
    .row-delete:active { transform: scale(.92); filter: brightness(.96); }
    tbody tr.completed { cursor: pointer; }
    tbody tr.completed:active { background: rgba(131,205,213,.13); }
    .ongoing { color: var(--teal); font-weight: 850; }
    .empty {
      padding: 40px 20px;
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 22px;
      background: rgba(255,253,248,.82);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 15;
      width: min(calc(100% - 28px), 360px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 999px;
      background: rgba(255,253,248,.90);
      box-shadow: 0 14px 40px rgba(23,74,74,.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .tab {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--teal); color: var(--paper); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: end center;
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
      background: rgba(15,55,55,.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .modal {
      width: min(100%, 520px);
      max-height: min(88vh, 720px);
      overflow: auto;
      padding: 22px 18px 18px;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 28px;
      background: rgba(255,253,248,.97);
      box-shadow: 0 24px 70px rgba(23,74,74,.22);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .modal-title { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .modal-close {
      width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--foam); color: var(--ink); font-size: 20px; cursor: pointer;
    }
    .modal-date { margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 19px; }
    .field { min-width: 0; }
    .field label { display: block; margin: 0 0 6px 2px; color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: .06em; }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 13px 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 17px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .field textarea { min-height: 92px; resize: vertical; text-align: left; font-size: 13px; line-height: 1.6; font-weight: 650; }
    .field.full { grid-column: 1 / -1; }
    .memo-textarea {
      width: 100%; min-height: 150px; margin-top: 16px; border: 1px solid var(--line); border-radius: 18px;
      padding: 14px; background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.7; resize: vertical;
    }
    .memo-hint { margin-top: 7px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .memo-actions { display: grid; grid-template-columns: .8fr 1.2fr; gap: 9px; margin-top: 14px; }
    .modal-btn.secondary { background: var(--foam); color: var(--ink); }
    .field-hint { margin-top: 5px; color: var(--muted); font-size: 8.5px; line-height: 1.4; }
    .cs-preview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(131,205,213,.17);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .cs-preview strong { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
    .modal-actions { display: grid; grid-template-columns: 1fr; gap: 9px; margin-top: 18px; }
    .modal-btn {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      font-weight: 850;
      cursor: pointer;
    }
    .modal-btn.save { background: var(--teal); color: var(--paper); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      z-index: 60;
      transform: translate(-50%, 40px);
      opacity: 0;
      max-width: calc(100vw - 34px);
      padding: 11px 15px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
      transition: .18s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 430px) {
      .main-card { padding: 25px 15px; }
      .clock { font-size: clamp(48px, 15vw, 68px); }
      th, td { font-size: 9.5px; padding: 11px 1px; }
      th { font-size: 7px; }
      .row-delete { width: 25px; height: 25px; font-size: 16px; }
      .history-note { font-size: 9px; }
    }
  </style>
</head>
<body data-state="idle">
  <main class="app">
    <section id="panel-clock">
      <div class="main-card">
        <div class="date" id="date-live">----</div>
        <div class="clock" id="clock-live">--:--</div>

        <div class="status-wrap">
          <div class="status"><span class="status-dot"></span><span id="status-text">OFF DUTY</span></div>
        </div>

        <div class="clock-in-options" id="clock-in-options">
          <button class="clock-action cs-in" id="clock-in-cs" type="button">CS出勤</button>
          <button class="clock-action hds-in" id="clock-in-hds" type="button">HDS出勤</button>
        </div>
        <button class="clock-action clock-out" id="clock-out" type="button" hidden>退勤</button>

        <div class="activity-area" id="activity-area" hidden>
          <div class="activity-buttons">
            <button class="activity-btn cs" type="button" data-activity="cs">CS</button>
            <button class="activity-btn hds" type="button" data-activity="hds">HDS</button>
            <button class="activity-btn rest" type="button" data-activity="rest">REST</button>
          </div>
        </div>

        <div class="shift-details" id="shift-details" hidden>
          <div class="in-stamp">IN <strong id="stamp-in">--:--</strong></div>
          <div class="cs-stamps" id="cs-stamps">
            <span>CS IN <strong id="stamp-cs-in">--:--</strong></span>
            <span>CS OUT <strong id="stamp-cs-out">--:--</strong></span>
          </div>
          <div class="metrics" aria-label="現在の勤務時間集計">
            <div class="metric"><div class="metric-label">CS</div><div class="metric-value" id="metric-cs">00:00</div></div>
            <div class="metric"><div class="metric-label">HDS</div><div class="metric-value" id="metric-hds">00:00</div></div>
            <div class="metric"><div class="metric-label">REST</div><div class="metric-value" id="metric-rest">00:00</div></div>
          </div>
        </div>
      </div>
    </section>

    <section id="panel-history" hidden>
      <div class="history-head">
        <div class="history-head-row">
          <h1 class="history-title">履歴</h1>
          <button class="detail-open" id="detail-open" type="button">詳細</button>
        </div>
        <div class="history-note">行をタップで編集、右端の×で削除</div>
      </div>
      <div id="history-container"></div>
    </section>

    <section id="panel-detail" hidden>
      <div class="detail-head">
        <div class="detail-top">
          <button class="detail-back" id="detail-back" type="button">← 履歴</button>
          <h1 class="history-title">詳細</h1>
        </div>
        <div class="detail-picker">
          <button class="date-step" id="detail-prev" type="button" aria-label="前の日">‹</button>
          <input class="detail-date-input" id="detail-date" type="date" aria-label="表示する日付">
          <button class="date-step" id="detail-next" type="button" aria-label="次の日">›</button>
        </div>
      </div>
      <div id="detail-container"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="画面切り替え">
    <button class="tab" id="tab-clock" type="button" aria-selected="true">打刻</button>
    <button class="tab" id="tab-history" type="button" aria-selected="false">履歴</button>
  </nav>

  <div class="modal-backdrop" id="edit-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="edit-title">履歴を編集</h2>
          <div class="modal-date" id="edit-date">----</div>
        </div>
        <button class="modal-close" id="edit-close" type="button" aria-label="閉じる">×</button>
      </div>

      <div class="edit-grid">
        <div class="field">
          <label for="edit-cs-in">CS IN</label>
          <input id="edit-cs-in" inputmode="numeric" autocomplete="off" placeholder="09:00">
          <div class="field-hint">CSなしの場合は空欄</div>
        </div>
        <div class="field">
          <label for="edit-cs-out">CS OUT</label>
          <input id="edit-cs-out" inputmode="numeric" autocomplete="off" placeholder="18:00">
          <div class="field-hint">日跨ぎは 25:00 のように入力</div>
        </div>
        <div class="field">
          <label for="edit-cs-total">CS TOTAL</label>
          <input id="edit-cs-total" inputmode="numeric" autocomplete="off" placeholder="06:30">
        </div>
        <div class="field">
          <label for="edit-hds">HDS TOTAL</label>
          <input id="edit-hds" inputmode="numeric" autocomplete="off" placeholder="01:30">
        </div>
        <div class="field">
          <label for="edit-rest">REST TOTAL</label>
          <input id="edit-rest" inputmode="numeric" autocomplete="off" placeholder="01:00">
        </div>
        <div class="field full">
          <label for="edit-note">業務内容・備考</label>
          <textarea id="edit-note" autocomplete="off" placeholder="その日の業務内容など"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn save" id="edit-save" type="button">保存</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="memo-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="memo-title">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="memo-title">本日の業務内容</h2>
          <div class="modal-date" id="memo-date">----</div>
        </div>
        <button class="modal-close" id="memo-close" type="button" aria-label="閉じる">×</button>
      </div>
      <textarea class="memo-textarea" id="memo-text" autocomplete="off" placeholder="今日やったこと、引き継ぎ、気づいたことなど"></textarea>
      <div class="memo-hint">退勤時刻はすでに保存されています。備考は空欄でも大丈夫です。</div>
      <div class="memo-actions">
        <button class="modal-btn secondary" id="memo-skip" type="button">あとで</button>
        <button class="modal-btn save" id="memo-save" type="button">保存</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const KEY = 'hds-status-time-tracker-v3';
    const OLD_KEY = 'hds-simple-time-tracker-v2';
    const TZ = 'Asia/Tokyo';
    const JST_OFFSET = '+09:00';
    const $ = id => document.getElementById(id);

    let data = { version: 5, shifts: [] };
    let activeTab = 'clock';
    let editingId = null;
    let memoShiftId = null;
    let detailDateKey = null;
    let toastTimer;

    const fmt = {
      date: new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }),
      dayCompact: new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, month: '2-digit', day: '2-digit' }),
      timeHM: new Intl.DateTimeFormat('ja-JP', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    };

    const clone = value => JSON.parse(JSON.stringify(value));
    const nowIso = () => new Date().toISOString();
    const toMs = iso => new Date(iso).getTime();
    const validIso = value => typeof value === 'string' && Number.isFinite(Date.parse(value));
    const randomId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;

    function ymdParts(value) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(value instanceof Date ? value : new Date(value));
      const map = Object.fromEntries(parts.filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
      return { y: Number(map.year), m: Number(map.month), d: Number(map.day) };
    }

    function ymdKey(value) {
      const { y, m, d } = ymdParts(value);
      return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    function calendarDayNumber(value) {
      const { y, m, d } = ymdParts(value);
      return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
    }

    function localHourMinute(value) {
      const parts = fmt.timeHM.formatToParts(value instanceof Date ? value : new Date(value));
      const map = Object.fromEntries(parts.filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
      return { hour: Number(map.hour), minute: Number(map.minute) };
    }

    function extendedTimeText(iso, baseIso) {
      if (!iso || !baseIso) return '--:--';
      const { hour, minute } = localHourMinute(iso);
      const dayDiff = calendarDayNumber(iso) - calendarDayNumber(baseIso);
      const extendedHour = hour + Math.max(0, dayDiff) * 24;
      return `${String(extendedHour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
    }

    function validActivity(s) {
      return s && ['cs', 'hds', 'rest'].includes(s.type) && validIso(s.start) &&
        (s.end === null || validIso(s.end)) && (s.end === null || toMs(s.end) >= toMs(s.start));
    }

    function validEditedSummary(s) {
      if (s === undefined || s === null) return true;
      const timesOk = (s.csIn === null || validIso(s.csIn)) && (s.csOut === null || validIso(s.csOut));
      const durationsOk = ['cs','hds','rest'].every(k => Number.isFinite(s[k]) && s[k] >= 0);
      return timesOk && durationsOk;
    }

    function validShift(s) {
      return s && typeof s.id === 'string' && validIso(s.workStart) &&
        (s.workEnd === null || validIso(s.workEnd)) &&
        (s.workEnd === null || toMs(s.workEnd) >= toMs(s.workStart)) &&
        Array.isArray(s.activitySessions) && s.activitySessions.every(validActivity) &&
        (s.note === undefined || typeof s.note === 'string') && validEditedSummary(s.editedSummary);
    }

    function save(next) {
      try {
        localStorage.setItem(KEY, JSON.stringify(next));
        data = next;
        return true;
      } catch {
        showToast('保存できませんでした');
        return false;
      }
    }

    function materializeSessions(shift) {
      const startMs = toMs(shift.workStart);
      const endMs = shift.workEnd ? toMs(shift.workEnd) : null;
      const src = (Array.isArray(shift.activitySessions) ? shift.activitySessions : [])
        .filter(validActivity)
        .map(x => ({ type: x.type, start: x.start, end: x.end }))
        .sort((a,b) => toMs(a.start) - toMs(b.start));
      const out = [];
      let cursor = startMs;

      for (const session of src) {
        let s = Math.max(startMs, toMs(session.start));
        let e = session.end === null ? null : toMs(session.end);
        if (endMs !== null) {
          if (s > endMs) break;
          if (e !== null) e = Math.min(e, endMs);
        }
        if (e !== null && e < s) continue;
        if (s > cursor) out.push({ type: 'cs', start: new Date(cursor).toISOString(), end: new Date(s).toISOString() });
        if (e === null) {
          out.push({ type: session.type, start: new Date(Math.max(s, cursor)).toISOString(), end: null });
          return out;
        }
        if (e > cursor) {
          out.push({ type: session.type, start: new Date(Math.max(s, cursor)).toISOString(), end: new Date(e).toISOString() });
          cursor = e;
        }
      }

      if (endMs !== null) {
        if (cursor < endMs) out.push({ type: 'cs', start: new Date(cursor).toISOString(), end: new Date(endMs).toISOString() });
      } else {
        out.push({ type: 'cs', start: new Date(cursor).toISOString(), end: null });
      }
      return out;
    }

    function rawSummaryFromSessions(shift, now = Date.now()) {
      const endFallback = shift.workEnd ? toMs(shift.workEnd) : now;
      const totals = { cs: 0, hds: 0, rest: 0 };
      let firstCs = null;
      let lastCsEnd = null;
      let csOpen = false;

      for (const session of shift.activitySessions) {
        const start = toMs(session.start);
        const end = session.end ? toMs(session.end) : endFallback;
        totals[session.type] += Math.max(0, end - start);
        if (session.type === 'cs') {
          if (firstCs === null || start < firstCs) firstCs = start;
          if (session.end === null) {
            csOpen = true;
          } else if (lastCsEnd === null || toMs(session.end) > lastCsEnd) {
            lastCsEnd = toMs(session.end);
          }
        }
      }

      return {
        ...totals,
        csIn: firstCs === null ? null : new Date(firstCs).toISOString(),
        csOut: csOpen ? null : (lastCsEnd === null ? null : new Date(lastCsEnd).toISOString())
      };
    }

    function migrateToV5(parsed) {
      if (!parsed || !Array.isArray(parsed.shifts)) return null;
      const shifts = parsed.shifts.filter(s => s && validIso(s.workStart)).map(s => {
        const base = {
          id: typeof s.id === 'string' ? s.id : randomId(),
          workStart: s.workStart,
          workEnd: validIso(s.workEnd) ? s.workEnd : null,
          activitySessions: Array.isArray(s.activitySessions) ? s.activitySessions : [],
          note: typeof s.note === 'string' ? s.note : ''
        };
        base.activitySessions = materializeSessions(base);
        if (base.workEnd && s.editedDurations && Number.isFinite(s.editedDurations.hds) && Number.isFinite(s.editedDurations.rest)) {
          const raw = rawSummaryFromSessions(base, toMs(base.workEnd));
          const gross = Math.max(0, toMs(base.workEnd) - toMs(base.workStart));
          const hds = Math.max(0, s.editedDurations.hds);
          const rest = Math.max(0, s.editedDurations.rest);
          base.editedSummary = {
            csIn: raw.csIn,
            csOut: raw.csOut,
            cs: Math.max(0, gross - hds - rest),
            hds,
            rest
          };
        }
        return base;
      });
      return { version: 5, shifts };
    }

    function migrateV2(parsed) {
      if (parsed?.version !== 2 || !Array.isArray(parsed.shifts)) return null;
      const temp = {
        version: 3,
        shifts: parsed.shifts.filter(s => s && validIso(s.workStart)).map(s => {
          const activities = [];
          (Array.isArray(s.hdsSessions) ? s.hdsSessions : []).forEach(x => {
            if (x && validIso(x.start)) activities.push({ type: 'hds', start: x.start, end: validIso(x.end) ? x.end : null });
          });
          (Array.isArray(s.breakSessions) ? s.breakSessions : []).forEach(x => {
            if (x && validIso(x.start)) activities.push({ type: 'rest', start: x.start, end: validIso(x.end) ? x.end : null });
          });
          return {
            id: typeof s.id === 'string' ? s.id : randomId(),
            workStart: s.workStart,
            workEnd: validIso(s.workEnd) ? s.workEnd : null,
            activitySessions: activities
          };
        })
      };
      return migrateToV5(temp);
    }

    function load() {
      try {
        const current = localStorage.getItem(KEY);
        if (current) {
          const parsed = JSON.parse(current);
          if (parsed?.version === 5 && Array.isArray(parsed.shifts) && parsed.shifts.every(validShift)) {
            data = parsed;
            return;
          }
          if ((parsed?.version === 4 || parsed?.version === 3 || parsed?.version === undefined) && Array.isArray(parsed.shifts)) {
            const migrated = migrateToV5(parsed);
            if (migrated) { save(migrated); return; }
          }
        }
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          const migrated = migrateV2(JSON.parse(old));
          if (migrated) save(migrated);
        }
      } catch {
        data = { version: 5, shifts: [] };
      }
    }

    function activeShift() { return data.shifts.find(s => s.workEnd === null) || null; }

    function openActivity(shift) {
      if (!shift?.activitySessions?.length) return null;
      return [...shift.activitySessions].reverse().find(s => s.end === null) || null;
    }

    function currentState() {
      const shift = activeShift();
      if (!shift) return 'idle';
      return openActivity(shift)?.type || 'cs';
    }

    function summary(shift, now = Date.now()) {
      if (!shift) return { cs: 0, hds: 0, rest: 0, csIn: null, csOut: null };
      if (shift.workEnd && shift.editedSummary) return shift.editedSummary;
      return rawSummaryFromSessions(shift, now);
    }

    function durationText(ms) {
      const totalMinutes = Math.floor(Math.max(0, ms) / 60000);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }

    function parseDurationInput(text) {
      const m = String(text).trim().match(/^(\d{1,3}):([0-5]\d)$/);
      if (!m) return null;
      return (Number(m[1]) * 60 + Number(m[2])) * 60000;
    }

    function parseClockInput(text, maxHour = 71) {
      const m = String(text).trim().match(/^(\d{1,2}):([0-5]\d)$/);
      if (!m) return null;
      const h = Number(m[1]);
      const min = Number(m[2]);
      if (h < 0 || h > maxHour) return null;
      return { h, min };
    }

    function addDaysToKey(key, days) {
      const [y,m,d] = key.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + days));
      return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    }

    function isoFromBaseKeyAndTime(baseKey, text, allowExtended = true) {
      const parsed = parseClockInput(text, allowExtended ? 71 : 23);
      if (!parsed) return null;
      const days = allowExtended ? Math.floor(parsed.h / 24) : 0;
      const hour = allowExtended ? parsed.h % 24 : parsed.h;
      const key = addDaysToKey(baseKey, days);
      const dt = new Date(`${key}T${String(hour).padStart(2,'0')}:${String(parsed.min).padStart(2,'0')}:00${JST_OFFSET}`);
      return Number.isFinite(dt.getTime()) ? dt.toISOString() : null;
    }

    function timeText(iso) { return iso ? fmt.timeHM.format(new Date(iso)) : '--:--'; }

    function showToast(text) {
      clearTimeout(toastTimer);
      const el = $('toast');
      el.textContent = text;
      el.classList.add('show');
      toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    function clockIn(type) {
      if (!['cs','hds'].includes(type) || activeShift()) return;
      const next = clone(data);
      const now = nowIso();
      next.shifts.unshift({
        id: randomId(),
        workStart: now,
        workEnd: null,
        activitySessions: [{ type, start: now, end: null }],
        note: ''
      });
      if (!save(next)) return;
      render();
      showToast(type === 'cs' ? 'CSで出勤しました' : 'HDSで出勤しました');
    }

    function clockOut() {
      const next = clone(data);
      const shift = next.shifts.find(s => s.workEnd === null) || null;
      if (!shift) return;
      const now = nowIso();
      const open = openActivity(shift);
      if (open) open.end = now;
      shift.workEnd = now;
      if (typeof shift.note !== 'string') shift.note = '';
      if (!save(next)) return;
      render();
      openMemo(shift.id);
      showToast('退勤を記録しました');
    }

    function openMemo(id) {
      const shift = data.shifts.find(s => s.id === id && s.workEnd !== null);
      if (!shift) return;
      memoShiftId = id;
      $('memo-date').textContent = fmt.date.format(new Date(shift.workStart));
      $('memo-text').value = typeof shift.note === 'string' ? shift.note : '';
      $('memo-backdrop').hidden = false;
      document.body.style.overflow = 'hidden';
      setTimeout(() => $('memo-text').focus(), 60);
    }

    function closeMemo() {
      memoShiftId = null;
      $('memo-backdrop').hidden = true;
      document.body.style.overflow = '';
    }

    function saveMemo() {
      if (!memoShiftId) return closeMemo();
      const next = clone(data);
      const shift = next.shifts.find(s => s.id === memoShiftId);
      if (!shift) return closeMemo();
      shift.note = $('memo-text').value.trim();
      if (!save(next)) return;
      closeMemo();
      if (activeTab === 'detail') renderDetail();
      showToast('備考を保存しました');
    }

    function changeActivity(type) {
      if (!['cs','hds','rest'].includes(type)) return;
      const next = clone(data);
      const shift = next.shifts.find(s => s.workEnd === null) || null;
      if (!shift) return;
      const open = openActivity(shift);
      if (open?.type === type) return;
      const now = nowIso();
      if (open) open.end = now;
      shift.activitySessions.push({ type, start: now, end: null });
      if (!save(next)) return;
      render();
      showToast({ cs:'CSに切り替えました', hds:'HDSに切り替えました', rest:'RESTに切り替えました' }[type]);
    }

    function renderMain() {
      const shift = activeShift();
      const state = currentState();
      document.body.dataset.state = state;

      $('status-text').textContent = { idle:'OFF DUTY', cs:'CS WORKING', hds:'HDS WORKING', rest:'RESTING' }[state] || 'OFF DUTY';
      $('clock-in-options').hidden = Boolean(shift);
      $('clock-out').hidden = !shift;
      $('activity-area').hidden = !shift;
      $('shift-details').hidden = !shift;

      document.querySelectorAll('[data-activity]').forEach(btn => {
        const active = btn.dataset.activity === state;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', String(active));
      });

      if (shift) $('stamp-in').textContent = timeText(shift.workStart);
      tick();
    }

    function tick() {
      const now = new Date();
      $('date-live').textContent = fmt.date.format(now);
      $('clock-live').textContent = fmt.timeHM.format(now);

      const shift = activeShift();
      if (shift) {
        const s = summary(shift, now.getTime());
        $('metric-cs').textContent = durationText(s.cs);
        $('metric-hds').textContent = durationText(s.hds);
        $('metric-rest').textContent = durationText(s.rest);
        $('stamp-cs-in').textContent = s.csIn ? extendedTimeText(s.csIn, shift.workStart) : '--:--';
        $('stamp-cs-out').textContent = s.csOut ? extendedTimeText(s.csOut, shift.workStart) : '--:--';
      }
    }

    function renderHistory() {
      const host = $('history-container');
      host.replaceChildren();

      if (!data.shifts.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'まだ履歴はありません';
        host.append(empty);
        return;
      }

      const rows = [...data.shifts].sort((a,b) => toMs(b.workStart) - toMs(a.workStart));
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      ['日付','CS IN','CS OUT','CS','HDS','REST',''].forEach(name => {
        const th = document.createElement('th'); th.textContent = name; hr.append(th);
      });
      thead.append(hr); table.append(thead);

      const tbody = document.createElement('tbody');
      rows.forEach(shift => {
        const tr = document.createElement('tr');
        tr.dataset.id = shift.id;
        const ongoing = shift.workEnd === null;
        if (!ongoing) {
          tr.className = 'completed';
          tr.tabIndex = 0;
          tr.setAttribute('role','button');
          tr.setAttribute('aria-label','履歴を編集');
        }
        const s = summary(shift, Date.now());
        const values = [
          fmt.dayCompact.format(new Date(shift.workStart)),
          s.csIn ? extendedTimeText(s.csIn, shift.workStart) : '--:--',
          s.csOut ? extendedTimeText(s.csOut, shift.workStart) : '--:--',
          durationText(s.cs),
          durationText(s.hds),
          durationText(s.rest)
        ];
        values.forEach((value,index) => {
          const td = document.createElement('td'); td.textContent = value;
          if (ongoing && index === 2 && currentState() === 'cs') td.className = 'ongoing';
          tr.append(td);
        });

        const deleteCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'row-delete';
        deleteButton.textContent = '×';
        deleteButton.setAttribute('aria-label', `${fmt.dayCompact.format(new Date(shift.workStart))}の履歴を削除`);
        deleteButton.addEventListener('click', e => {
          e.stopPropagation();
          deleteShift(shift.id);
        });
        deleteCell.append(deleteButton);
        tr.append(deleteCell);

        if (!ongoing) {
          const open = () => openEdit(shift.id);
          tr.addEventListener('click', open);
          tr.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === tr) { e.preventDefault(); open(); } });
        }
        tbody.append(tr);
      });
      table.append(tbody); wrap.append(table); host.append(wrap);
    }

    function shiftEvents(shift) {
      const sessions = [...(shift.activitySessions || [])].filter(validActivity).sort((a,b) => toMs(a.start) - toMs(b.start));
      const events = sessions.map((session, index) => ({
        time: session.start,
        type: session.type,
        label: index === 0 ? `${session.type.toUpperCase()}出勤` : `${session.type.toUpperCase()}へ切替`
      }));
      if (shift.workEnd) events.push({ time: shift.workEnd, type: 'out', label: '退勤' });
      return events;
    }

    function availableDateKeys() {
      return [...new Set(data.shifts.map(s => ymdKey(s.workStart)))].sort();
    }

    function setDetailDate(key) {
      detailDateKey = key;
      $('detail-date').value = key || '';
      renderDetail();
    }

    function stepDetailDate(days) {
      const base = detailDateKey || ymdKey(new Date());
      setDetailDate(addDaysToKey(base, days));
    }

    function renderDetail() {
      const host = $('detail-container');
      host.replaceChildren();
      const keys = availableDateKeys();
      if (!detailDateKey) detailDateKey = keys.at(-1) || ymdKey(new Date());
      $('detail-date').value = detailDateKey;
      if (keys.length) {
        $('detail-date').min = keys[0];
        $('detail-date').max = keys[keys.length - 1];
      } else {
        $('detail-date').removeAttribute('min');
        $('detail-date').removeAttribute('max');
      }

      const shifts = data.shifts
        .filter(s => ymdKey(s.workStart) === detailDateKey)
        .sort((a,b) => toMs(a.workStart) - toMs(b.workStart));

      if (!shifts.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'この日の記録はありません';
        host.append(empty);
        return;
      }

      shifts.forEach((shift, index) => {
        const card = document.createElement('section');
        card.className = 'detail-shift';
        const head = document.createElement('div');
        head.className = 'detail-shift-head';
        const title = document.createElement('div');
        title.className = 'detail-shift-title';
        title.textContent = shifts.length > 1 ? `勤務 ${index + 1}` : '勤務ログ';
        const range = document.createElement('div');
        range.className = 'detail-shift-range';
        range.textContent = `${extendedTimeText(shift.workStart, shift.workStart)} → ${shift.workEnd ? extendedTimeText(shift.workEnd, shift.workStart) : '勤務中'}`;
        head.append(title, range);
        card.append(head);

        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        shiftEvents(shift).forEach(event => {
          const row = document.createElement('div');
          row.className = 'timeline-row';
          const time = document.createElement('div');
          time.className = 'timeline-time';
          time.textContent = extendedTimeText(event.time, shift.workStart);
          const dot = document.createElement('span');
          dot.className = `timeline-dot ${event.type}`;
          const label = document.createElement('div');
          label.className = 'timeline-label';
          label.textContent = event.label;
          row.append(time, dot, label);
          timeline.append(row);
        });
        card.append(timeline);

        if (typeof shift.note === 'string' && shift.note.trim()) {
          const note = document.createElement('div');
          note.className = 'detail-note-box';
          const lab = document.createElement('div');
          lab.className = 'detail-note-label';
          lab.textContent = '業務内容・備考';
          const body = document.createElement('div');
          body.className = 'detail-note-text';
          body.textContent = shift.note.trim();
          note.append(lab, body);
          card.append(note);
        }
        host.append(card);
      });
    }

    function openEdit(id) {
      const shift = data.shifts.find(s => s.id === id && s.workEnd !== null);
      if (!shift) return;
      editingId = id;
      const s = summary(shift);
      $('edit-date').textContent = fmt.date.format(new Date(shift.workStart));
      $('edit-cs-in').value = s.csIn ? extendedTimeText(s.csIn, shift.workStart) : '';
      $('edit-cs-out').value = s.csOut ? extendedTimeText(s.csOut, shift.workStart) : '';
      $('edit-cs-total').value = durationText(s.cs);
      $('edit-hds').value = durationText(s.hds);
      $('edit-rest').value = durationText(s.rest);
      $('edit-note').value = typeof shift.note === 'string' ? shift.note : '';
      $('edit-backdrop').hidden = false;
      document.body.style.overflow = 'hidden';
      setTimeout(() => $('edit-cs-in').focus(), 50);
    }

    function closeEdit() {
      editingId = null;
      $('edit-backdrop').hidden = true;
      document.body.style.overflow = '';
    }

    function saveEdit() {
      if (!editingId) return;
      const original = data.shifts.find(s => s.id === editingId && s.workEnd !== null);
      if (!original) return;
      const baseKey = ymdKey(original.workStart);
      const csInText = $('edit-cs-in').value.trim();
      const csOutText = $('edit-cs-out').value.trim();
      const cs = parseDurationInput($('edit-cs-total').value);
      const hds = parseDurationInput($('edit-hds').value);
      const rest = parseDurationInput($('edit-rest').value);

      if (cs === null || hds === null || rest === null) {
        showToast('時間はHH:MM形式で入力してください');
        return;
      }
      if ((csInText && !csOutText) || (!csInText && csOutText)) {
        showToast('CS INとCS OUTは両方入力してください');
        return;
      }

      let csIn = null;
      let csOut = null;
      if (csInText && csOutText) {
        csIn = isoFromBaseKeyAndTime(baseKey, csInText, true);
        csOut = isoFromBaseKeyAndTime(baseKey, csOutText, true);
        if (!csIn || !csOut) {
          showToast('CS時刻はHH:MM形式で入力してください');
          return;
        }
        if (toMs(csOut) < toMs(csIn)) {
          showToast('CS OUTはCS INより後にしてください');
          return;
        }
      }

      const next = clone(data);
      const shift = next.shifts.find(s => s.id === editingId);
      shift.editedSummary = { csIn, csOut, cs, hds, rest };
      shift.note = $('edit-note').value.trim();
      if (!save(next)) return;
      closeEdit();
      render();
      showToast('履歴を更新しました');
    }

    function deleteShift(id) {
      if (!id || !data.shifts.some(s => s.id === id)) return;
      const next = clone(data);
      next.shifts = next.shifts.filter(s => s.id !== id);
      if (!save(next)) return;
      if (editingId === id) closeEdit();
      render();
      showToast('削除しました');
    }

    function selectTab(tab) {
      activeTab = tab;
      const clock = tab === 'clock';
      const history = tab === 'history';
      const detail = tab === 'detail';
      $('panel-clock').hidden = !clock;
      $('panel-history').hidden = !history;
      $('panel-detail').hidden = !detail;
      $('tab-clock').setAttribute('aria-selected', String(clock));
      $('tab-history').setAttribute('aria-selected', String(history || detail));
      if (history) renderHistory();
      if (detail) renderDetail();
    }

    $('clock-in-cs').addEventListener('click', () => clockIn('cs'));
    $('clock-in-hds').addEventListener('click', () => clockIn('hds'));
    $('clock-out').addEventListener('click', clockOut);
    document.querySelectorAll('[data-activity]').forEach(btn => btn.addEventListener('click', () => changeActivity(btn.dataset.activity)));
    $('tab-clock').addEventListener('click', () => selectTab('clock'));
    $('tab-history').addEventListener('click', () => selectTab('history'));
    $('detail-open').addEventListener('click', () => {
      const keys = availableDateKeys();
      detailDateKey = keys.at(-1) || ymdKey(new Date());
      selectTab('detail');
    });
    $('detail-back').addEventListener('click', () => selectTab('history'));
    $('detail-date').addEventListener('change', e => { if (e.target.value) setDetailDate(e.target.value); });
    $('detail-prev').addEventListener('click', () => stepDetailDate(-1));
    $('detail-next').addEventListener('click', () => stepDetailDate(1));
    $('edit-close').addEventListener('click', closeEdit);
    $('edit-save').addEventListener('click', saveEdit);
    $('memo-close').addEventListener('click', closeMemo);
    $('memo-skip').addEventListener('click', closeMemo);
    $('memo-save').addEventListener('click', saveMemo);
    $('edit-backdrop').addEventListener('click', e => { if (e.target === $('edit-backdrop')) closeEdit(); });
    $('memo-backdrop').addEventListener('click', e => { if (e.target === $('memo-backdrop')) closeMemo(); });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!$('memo-backdrop').hidden) closeMemo();
      else if (!$('edit-backdrop').hidden) closeEdit();
    });

    window.addEventListener('storage', event => {
      if (event.key !== KEY || !event.newValue) return;
      try {
        const incoming = JSON.parse(event.newValue);
        if (incoming?.version === 5 && Array.isArray(incoming.shifts) && incoming.shifts.every(validShift)) {
          data = incoming;
          render();
        }
      } catch {}
    });

    function render() {
      renderMain();
      if (activeTab === 'history') renderHistory();
      if (activeTab === 'detail') renderDetail();
    }

    load();
    render();
    setInterval(() => {
      if (!document.hidden) {
        tick();
        if (activeTab === 'history' && activeShift()) renderHistory();
        if (activeTab === 'detail' && activeShift()) renderDetail();
      }
    }, 1000);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
